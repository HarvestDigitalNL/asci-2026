          <lightning-select

          >

        <div class="custom-input_container">
          <div class="input-title">Max. resultaten</div>
          <div class="custom-input">

                class="styleless-input"
                type="number"
                variant="label-hidden"
                value={resultLimit}
                data-type="limit"
                onchange={handleChange}
                disabled={isSearching}
              ></lightning-input>
            </div>
            <div class="adjust-buttons">
              <lightning-icon
                icon-name="utility:chevronleft"
                size="xx-small"
                alternative-text="decrease"
                data-type="decrease"
                onclick={adjustSearchLimit}
              ></lightning-icon>
              <lightning-icon
                icon-name="utility:chevronright"
                size="xx-small"
                alternative-text="increase"
                data-type="increase"
                onclick={adjustSearchLimit}
              ></lightning-icon>
            </div>
          </div>

            label="Zoek vluchten"

            variant="brand"
            disabled={disableSearch}
